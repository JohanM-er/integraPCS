name: Chromatic

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  chromatic:
    name: Build and Publish Storybook to Chromatic
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm 9.1.0
        run: corepack prepare pnpm@9.1.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared types (if present)
        run: pnpm nx build packages-shared-types --if-present

      - name: Build Storybook (web)
        run: pnpm nx run frontend:storybook:build

      - name: Publish to Chromatic
        uses: chromaui/action@v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: frontend/storybook-static
          exitZeroOnChanges: true
          onlyChanged: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
